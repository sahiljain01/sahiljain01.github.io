<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahil Jain</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/typewriter-effect@2.3.1/dist/core.js"></script>
</head>
<body class="light-mode">
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode">☀️</button>
    <div class="landing-container" id="landing">
        <div class="landing-content">
            <div class="landing-image">
                <img src="img/sahil-outline.png" alt="Sahil Outline" class="sahil-outline" />
            </div>
            <div class="intro-section">
                <div class="typing-container">
                    <span class="greeting">Hi... I'm  </span>
                    <span class="name" id="typing-text"></span>
                </div>
                <div class="subtitle" id="subtitle-text"></div>
            </div>
        </div>
    </div>

    <div class="section" id="work">
        <h2>Work Experience</h2>
        <p>Details about your work experience go here.</p>
    </div>
    <div class="section" id="projects">
        <h2>Projects</h2>
        <p>Details about your projects go here.</p>
    </div>
    <div class="section" id="blog">
        <h2>Blog</h2>
        <p>Blog posts or links go here.</p>
    </div>

    <nav class="side-nav">
        <ul>
            <li><button onclick="scrollToSection('landing')">Home</button></li>
            <li><button onclick="scrollToSection('work')">Work</button></li>
            <li><button onclick="scrollToSection('projects')">Projects</button></li>
            <li><button onclick="scrollToSection('blog')">Blog</button></li>
        </ul>
    </nav>

    <script src="main.js"></script>
    <script>
    function scrollToSection(id) {
        document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
    }

    // Theme toggle logic
    const toggleBtn = document.getElementById('theme-toggle');
    toggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        if(document.body.classList.contains('light-mode')) {
            toggleBtn.textContent = '☀️';
        } else {
            toggleBtn.textContent = '🌙';
        }
    });
    </script>
</body>
</html>
